spring.application.name=eatery-backend
server.port=8000

# Baza Podataka
spring.datasource.url=jdbc:mysql://localhost:3306/eatery_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Jackson 3: datum kao ISO tekst, ne kao timestamp (stari ključ write-dates-as-timestamps više nije u SerializationFeature)
spring.jackson.datatype.datetime.write-dates-as-timestamps=false